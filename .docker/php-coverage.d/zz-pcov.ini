; Reativa o PCOV, que a imagem mantém desligado (veja o Dockerfile).
;
; Este diretório é acrescentado ao fim de PHP_INI_SCAN_DIR apenas durante a
; medição, pelo target `coverage` do Makefile. PHP_INI_SCAN_DIR — e não
; `php -d` — porque `php artisan test` delega a execução para um processo PHP
; filho, que não herdaria flags de linha de comando.
pcov.enabled=1
