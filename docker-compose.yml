services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chamados_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: chamados
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chamados

  db:
    image: mysql:8.0
    container_name: chamados_db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chamados
      MYSQL_USER: chamados
      MYSQL_PASSWORD: chamados
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - chamados

  # Optional: run tests without affecting dev DB
  # Usage: docker compose run --rm test php artisan test
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chamados_test
    profiles: ["testing"]
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      SKIP_MIGRATIONS: "true"
    command: php artisan test --testdox
    networks:
      - chamados

volumes:
  mysql_data:

networks:
  chamados:
    driver: bridge
